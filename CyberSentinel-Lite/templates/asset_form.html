{% extends "base.html" %}
{% block title %}{{ 'Edit Asset' if asset else 'Add Asset' }} - CyberSentinel Lite{% endblock %}
{% block content %}
<h1 class="mb-4">{{ 'Edit Asset' if asset else 'Add Asset' }}</h1>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label for="name" class="form-label">Asset Name</label>
        <input type="text" class="form-control" id="name" name="name" maxlength="120" required
               value="{{ (form_data['name'] if form_data else asset['name'] if asset else '') }}">
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="category" class="form-label">Category</label>
          <select class="form-select" id="category" name="category" required>
            {% for c in categories %}
            <option value="{{ c }}" {{ 'selected' if (form_data['category'] if form_data else asset['category'] if asset else '') == c }}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label for="criticality" class="form-label">Criticality</label>
          <select class="form-select" id="criticality" name="criticality" required>
            {% for c in criticalities %}
            <option value="{{ c }}" {{ 'selected' if (form_data['criticality'] if form_data else asset['criticality'] if asset else '') == c }}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label for="owner" class="form-label">Owner</label>
        <input type="text" class="form-control" id="owner" name="owner" required
               value="{{ (form_data['owner'] if form_data else asset['owner'] if asset else '') }}">
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3">{{ (form_data['description'] if form_data else asset['description'] if asset else '') }}</textarea>
      </div>
      <button type="submit" class="btn btn-teal">{{ 'Save Changes' if asset else 'Add Asset' }}</button>
      <a class="btn btn-secondary" href="{{ url_for('assets_list') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
